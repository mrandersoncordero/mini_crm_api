# Configuración para migraciones del schema TENANT.
# Uso:
#   alembic -c alembic_tenant.ini revision --autogenerate -m "descripcion"
#   alembic -c alembic_tenant.ini upgrade head   ← solo para pruebas locales
#
# En producción los schemas tenant los migra TenantService automáticamente.

[alembic]
script_location = %(here)s/alembic
version_locations = %(here)s/alembic/versions/tenant
prepend_sys_path = .
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
